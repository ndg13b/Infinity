name: Publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the tree, write a Pages deployment, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on if it has never been enabled for this repo.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        # The action excludes .git and .github from the artifact.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
